name: Close Mirror Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Comment once and close
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequest = context.payload.pull_request;
            const marker = "<!-- switchyard-read-only-mirror-pr-notice -->";
            const body = [
              marker,
              "Hi, and thank you for taking the time to prepare this.",
              "",
              "This GitHub repository is a read-only mirror. Development and review happen in a private canonical repository, so pull requests opened here cannot be merged or reviewed in the usual way.",
              "",
              "I am closing this PR so the mirror does not look like an active review queue. If you want to discuss the change, please contact the maintainer through the same route that pointed you to this mirror.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const alreadyCommented = comments.some((comment) => comment.body && comment.body.includes(marker));

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pullRequest.number,
              state: "closed",
            });
